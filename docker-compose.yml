services:
  kage:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-amoszp}/kage:${KAGE_TAG:-latest}
    container_name: kage
    restart: unless-stopped
    ports:
      - "1106:4477"
    env_file:
      - ./backend/.env
    volumes:
      # Host-side folder that keeps the SQLite database across rebuilds/restarts.
      - ./data:/app/backend/data
    networks:
      - default
      - accounts

networks:
  accounts:
    # Created by the accounts service's compose file.
    external: true
